<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Run - Vendor Onboarding</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <header class="topbar">
    <div class="inner">
      <a class="brand" href="/">Vendor Onboarding <small>Procurement</small></a>
      <nav class="nav">
        <a href="/">New submission</a>
        <a href="/dashboard.html">Dashboard</a>
      </nav>
      <div class="sys-status" id="sys-status"></div>
    </div>
  </header>

  <main class="container">
    <div class="page-head">
      <div>
        <div class="muted small"><a href="/dashboard.html">Dashboard</a> / Run <span id="crumb"></span></div>
        <h1 id="title">Loading…</h1>
        <p id="meta"></p>
      </div>
      <div id="head-status"></div>
    </div>

    <div id="page-notice"></div>

    <div class="grid wide-right">
      <section>
        <div class="panel">
          <div class="panel-head">
            <h2>Process</h2>
            <span class="small muted" id="stage-counter"></span>
          </div>
          <div class="progress"><div id="progress-bar" style="width:0%"></div></div>
          <div id="stages"></div>
        </div>
      </section>

      <section>
        <div class="panel">
          <div class="panel-head"><h2>Decision</h2></div>
          <div class="panel-body" id="decision"><span class="muted">Waiting for the checks to finish…</span></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h2>Messages</h2><span class="small muted" id="msg-count"></span></div>
          <div class="panel-body" id="messages"><span class="muted">Nothing sent yet.</span></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h2>Submission</h2></div>
          <div class="panel-body" id="submission"></div>
        </div>
        <div class="panel">
          <div class="panel-head"><h2>Documents</h2></div>
          <div class="panel-body flush" id="documents"></div>
        </div>
      </section>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script src="/js/run.js"></script>
</body>
</html>
